<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Absensi | PLN UIP3B Sumatera</title>
<script src="https://cdn.tailwindcss.com"></script><script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script></head>
<body class="bg-slate-100 min-h-screen"><header class="bg-[#0b3b78] text-white"><div class="max-w-6xl mx-auto px-5 py-4 flex justify-between"><b>PLN UIP3B Sumatera — Admin</b><a href="index.html">Absensi</a></div></header>
<main class="max-w-6xl mx-auto p-5 space-y-5">
<section class="bg-white rounded-2xl p-5 shadow"><h1 class="text-xl font-bold">Daftarkan Karyawan + Wajah</h1><p class="text-sm text-slate-500 mb-4">Gunakan NIK unik. Data face descriptor disimpan di Firestore.</p>
<div class="grid md:grid-cols-2 gap-3"><input id="nik" class="border rounded-xl p-3" placeholder="NIK"><input id="nama" class="border rounded-xl p-3" placeholder="Nama lengkap"></div>
<div class="mt-4 max-w-xl relative"><video id="video" autoplay muted playsinline class="w-full rounded-2xl bg-black"></video></div>
<div class="flex gap-3 mt-3"><button id="cam" class="bg-[#0b3b78] text-white px-4 py-3 rounded-xl">Aktifkan Kamera</button><button id="register" class="bg-emerald-600 text-white px-4 py-3 rounded-xl">Daftarkan Wajah</button></div><p id="msg" class="mt-3 text-sm"></p></section>
<section class="bg-white rounded-2xl p-5 shadow"><div class="flex justify-between"><h2 class="font-bold">Riwayat Absensi</h2><button id="refresh" class="text-[#0b3b78] font-semibold">Refresh</button></div><div class="overflow-auto mt-4"><table class="min-w-full text-sm"><thead><tr class="border-b text-left"><th class="p-2">Waktu</th><th class="p-2">NIK</th><th class="p-2">Nama</th><th class="p-2">Jenis</th><th class="p-2">Verifikasi</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getFirestore,collection,addDoc,getDocs,query,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js"; const app=initializeApp(firebaseConfig),db=getFirestore(app); const $=id=>document.getElementById(id);
let stream,ready=false;
async function models(){const b="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";await faceapi.nets.tinyFaceDetector.loadFromUri(b);await faceapi.nets.faceLandmark68Net.loadFromUri(b);await faceapi.nets.faceRecognitionNet.loadFromUri(b);ready=true;}
$("cam").onclick=async()=>{try{if(!ready)await models();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});$("video").srcObject=stream;$("msg").textContent="Kamera aktif."}catch(e){$("msg").textContent=e.message}};
$("register").onclick=async()=>{try{if(!ready||!stream)throw Error("Aktifkan kamera.");const nik=$("nik").value.trim(),nama=$("nama").value.trim();if(!nik||!nama)throw Error("NIK dan nama wajib.");const d=await faceapi.detectSingleFace($("video"),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.55})).withFaceLandmarks().withFaceDescriptor();if(!d)throw Error("Wajah tidak terdeteksi.");await addDoc(collection(db,"employees"),{nik,nama,faceDescriptor:Array.from(d.descriptor),createdAt:serverTimestamp()});$("msg").textContent="✓ Karyawan berhasil didaftarkan.";}catch(e){$("msg").textContent="✕ "+e.message;}};
async function load(){const s=await getDocs(query(collection(db,"attendance"),orderBy("createdAt","desc"),limit(100)));$("rows").innerHTML="";s.forEach(x=>{const a=x.data();const t=a.createdAt?.toDate?.()||new Date(a.clientTime);$("rows").insertAdjacentHTML("beforeend",`<tr class="border-b"><td class="p-2">${t.toLocaleString("id-ID")}</td><td class="p-2">${a.nik||""}</td><td class="p-2">${a.nama||""}</td><td class="p-2">${a.type||""}</td><td class="p-2">${a.verified?"✓":"—"}</td></tr>`)})}
$("refresh").onclick=load;load();
</script></body></html>
